<!doctype html><meta charset="utf-8"><title>Distant Sectors unit icons</title>
<style>body{background:#0b1220;color:#cbd5e1;font:13px system-ui;padding:20px}table{border-collapse:collapse}th{text-align:left;padding:8px 14px 8px 0;white-space:nowrap}td{text-align:center;padding:8px 6px;border-top:1px solid #1e293b}td div{font-size:11px;color:#94a3b8;margin-top:2px}h1{font-weight:500;font-size:18px}h1 span{color:#94a3b8;font-size:13px}td.v3{background:#101d2e}p.key{color:#94a3b8;margin:0 0 14px}p.key b{color:#cbd5e1;font-weight:500}</style>
<h1>Distant Sectors — unit icons <span>· console art at 64px, map token at 28px</span></h1>
<p class="key">Read from <b>manifest.json</b>, so this sheet cannot drift from what the game
loads. A <b>lit cell</b> is a class on traced v3 artwork with a separate map variant;
an unlit one is still on the generic placeholder.</p>
<div id="sheet">Loading manifest…</div>
<script type="module">
// Generated from the manifest rather than written by hand: the previous version
// was a static table of filenames, which silently went stale the moment the
// manifest was repointed at the v3 glyphs.
const res = await fetch('manifest.json', { cache: 'no-store' });
const manifest = await res.json();
const icons = manifest.icons ?? {};
const factions = Object.entries(manifest.factions ?? {});
const classes = Object.keys(manifest.classes ?? {});
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cell = key => {
  const e = icons[key];
  if (!e) return '<td></td>';
  const map = e.mapFile ?? e.file, traced = !!e.mapFile;
  // The map row is drawn at its true relative size. A framed glyph fills its
  // viewBox, so the class ladder comes from the manifest; a placeholder already
  // carries the ladder in its artwork and is drawn at the full 28.
  const token = Math.round(28 * (e.framed ? (e.size ?? 1) : 1));
  return `<td class="${traced ? 'v3' : ''}">`
    + `<img src="${esc(e.file)}" width="64" height="64" alt="${esc(key)} console art" loading="lazy">`
    + `<br><img src="${esc(map)}" width="${token}" height="${token}" alt="${esc(key)} map token" loading="lazy">`
    + `<div>${esc(e.abbr ?? '')}</div></td>`;
};
document.querySelector('#sheet').innerHTML =
  '<table><tr><th></th>' + classes.map(c => `<th style="text-align:center">${esc(c)}</th>`).join('') + '</tr>'
  + factions.map(([code, f]) =>
      `<tr><th>${esc(f.name ?? code)}</th>` + classes.map(c => cell(`${code}/${c}`)).join('') + '</tr>').join('')
  + '</table>';
</script>
